name: NekrozVPN Builder

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: nekrozvpn-builder
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install libsql-experimental

      - name: Install sing-box (для реальной проверки конфигов)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SINGBOX_FALLBACK="1.11.1"
          SINGBOX_VERSION=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | grep -Po '"tag_name": "v\K[^"]*' || true)
          if [ -z "$SINGBOX_VERSION" ]; then
            echo "⚠️ Не удалось определить последнюю версию sing-box (rate limit или сбой API) — использую запасную ${SINGBOX_FALLBACK}"
            SINGBOX_VERSION="$SINGBOX_FALLBACK"
          fi
          echo "Устанавливаю sing-box v${SINGBOX_VERSION}"
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz" -o singbox.tar.gz
          tar -xzf singbox.tar.gz
          sudo mv "sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sudo chmod +x /usr/local/bin/sing-box
          sing-box version

      - name: Run builder
        run: python main.py

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: nekrozvpn-output
          path: output/
          if-no-files-found: error
