name: NekrozVPN Builder

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: nekrozvpn-builder
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install libsql-experimental

      - name: Install Xray-core (для реальной проверки конфигов — тот же движок, что у Happ)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          XRAY_FALLBACK="25.6.8"
          XRAY_VERSION=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/XTLS/Xray-core/releases/latest \
            | grep -Po '"tag_name": "v\K[^"]*' || true)
          if [ -z "$XRAY_VERSION" ]; then
            echo "⚠️ Не удалось определить последнюю версию Xray-core (rate limit или сбой API) — использую запасную ${XRAY_FALLBACK}"
            XRAY_VERSION="$XRAY_FALLBACK"
          fi
          echo "Устанавливаю Xray-core v${XRAY_VERSION}"
          curl -sL "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" -o xray.zip
          unzip -q xray.zip -d xray-bin
          sudo mv xray-bin/xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray
          xray version

      - name: Run builder
        run: python main.py

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: nekrozvpn-output
          path: output/
          if-no-files-found: error
