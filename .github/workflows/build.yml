name: HQRay VPN Builder

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "builder/**"
      - ".github/workflows/**"

concurrency:
  group: hqray-builder
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install libsql-experimental

      - name: Install Xray-core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          XRAY_FALLBACK="25.6.8"
          XRAY_VERSION=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/XTLS/Xray-core/releases/latest \
            | grep -Po '"tag_name": "v\K[^"]*' || true)
          if [ -z "$XRAY_VERSION" ]; then
            XRAY_VERSION="$XRAY_FALLBACK"
          fi
          echo "Installing Xray-core v${XRAY_VERSION}"
          curl -sL "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" -o xray.zip
          unzip -q xray.zip -d xray-bin
          sudo mv xray-bin/xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray
          xray version

      - name: Install sing-box (for Hysteria 2 True Delay)
        run: |
          SINGBOX_FALLBACK="1.11.0"
          echo "Installing sing-box v${SINGBOX_FALLBACK}"
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_FALLBACK}/sing-box-${SINGBOX_FALLBACK}-linux-amd64.tar.gz" -o singbox.tar.gz
          tar -xzf singbox.tar.gz
          sudo mv sing-box-${SINGBOX_FALLBACK}-linux-amd64/sing-box /usr/local/bin/sing-box
          sudo chmod +x /usr/local/bin/sing-box
          sing-box version

      - name: Run builder
        env:
          PYTHONIOENCODING: "utf-8"
          TURSO_URL: ${{ secrets.TURSO_URL || 'https://nekrozvpn-evgen.aws-eu-west-1.turso.io' }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN || 'eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODI1Nzk2MTAsImlkIjoiMDE5ZjBhMDYtMWUwMS03MTIwLTg3ZGMtYWEyMmYxMjk3OGJhIiwicmlkIjoiNGZjYmQwOTAtODA0OS00ZjAwLWExN2ItNjY1Y2E2MDE0ZDVkIn0.Hsq1HO-Y7kB5l_O9QspI33eomZUAvWHfdfEXAxXZ8EmJmiC37FmkAXanQqazPsFf3uvds8vcfK1Ak_KDtkYgCg' }}
        run: python builder/main.py

      - name: Validate sing-box configs
        run: |
          echo "Validating singbox_vip.json..."
          sing-box check -c builder/output/singbox_vip.json
          echo "Validating singbox_free.json..."
          sing-box check -c builder/output/singbox_free.json

      - name: Commit and push updated subscriptions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add builder/output/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(feed): auto-update subscriptions [skip ci]" && git push)
